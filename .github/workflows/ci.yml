name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipsense
          POSTGRES_PASSWORD: shipsense
          POSTGRES_DB: shipsense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shipsense"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://shipsense:shipsense@localhost:5432/shipsense_test
      DATABASE_URL: postgresql://shipsense:shipsense@localhost:5432/shipsense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and PostgreSQL integration tests
        run: python -m pytest -v
      - name: Run the pipeline on the sample files (CLI)
        run: python -m shipsense.run data/samples/*.csv data/samples/*.jsonl

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate and lint the SAM template
        run: sam validate --lint
        env:
          AWS_REGION: ap-southeast-1
          SAM_CLI_TELEMETRY: 0
      - name: Build the API image
        run: docker build -t shipsense-api .
